name: Firestore Rules Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-firestore-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          java -version
          echo "Firebase demo project: demo-polish-learning"

      - name: Install locked dependencies
        run: npm ci

      - name: Show local Firebase CLI version
        run: ./node_modules/.bin/firebase --version

      - name: Run CI security preflight
        run: npm run ci:validate:firestore-rules

      - name: Show separated runtime contracts
        run: |
          echo "RULES_RUNTIME_EXPECTED_TOTAL=201"
          echo "RULES_RUNTIME_EXPECTED_ALLOW=82"
          echo "RULES_RUNTIME_EXPECTED_DENY=119"
          echo "REGISTRATION_REQUEST_RUNTIME_EXPECTED_TOTAL=52"
          echo "REGISTRATION_REQUEST_RUNTIME_EXPECTED_ALLOW=34"
          echo "REGISTRATION_REQUEST_RUNTIME_EXPECTED_DENY=18"
          echo "REGISTRATION_REQUEST_EXPECTED_SUCCESS=34"
          echo "REGISTRATION_REQUEST_EXPECTED_RULES_DENY=13"
          echo "REGISTRATION_REQUEST_EXPECTED_CONTRACT_ERROR=4"
          echo "REGISTRATION_REQUEST_EXPECTED_NOT_FOUND=1"

      - name: Run RegistrationRequest runtime static precheck
        run: node scripts/validate-registration-request-runtime-tests.mjs

      - name: Run Firestore Rules runtime tests
        run: npm run test:rules:firestore

      - name: Run RegistrationRequest repository runtime tests
        run: ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-polish-learning "node --test tests/integration/saas/registrationRequest/registrationRequestRepository.runtime.test.mjs"
